{% extends 'base.html' %}
{% block content %}
<h2>Admin Attendance</h2>
<form method="post">
  <label>Admin <select name="admin_id">{% for a in admins %}<option value="{{a.id}}">{{a.name}}</option>{% endfor %}</select></label>
  <label>Date <input type="date" name="attendance_date" required /></label>
  <label>Status <select name="status"><option>Present</option><option>Absent</option></select></label>
  <label>Shift Label <input name="shift_label" /></label>
  <label>Hours <input name="hours_worked" type="number" step="0.5" /></label>
  <button>Save</button>
</form>
<table>
  <tr><th>Date</th><th>Admin</th><th>Status</th><th>Shift</th><th>Hours</th></tr>
  {% for r in records %}<tr><td>{{r.attendance_date}}</td><td>{{r.admin.name}}</td><td>{{r.status}}</td><td>{{r.shift_label}}</td><td>{{r.hours_worked}}</td></tr>{% endfor %}
</table>
{% endblock %}
