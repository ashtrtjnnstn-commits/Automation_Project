{% extends 'base.html' %}
{% block content %}
<h2>Payment Tracker</h2>
<form method="post">
  <label>Student <select name="student_id">{% for s in students %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></label>
  <label>Payment Date <input type="date" name="payment_date" required /></label>
  <label>Amount <input type="number" name="amount" step="0.01" required /></label>
  <label>Notes <textarea name="notes"></textarea></label>
  <button>Record Payment</button>
</form>
{% endblock %}
