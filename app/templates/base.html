<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SkinnerBox Children's Center</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
<header>
  <h1>SkinnerBox Children's Center</h1>
  <nav>
    <a href="{{ url_for('web.dashboard') }}">Dashboard</a>
    <a href="{{ url_for('web.daily_schedule') }}">Daily Schedule</a>
    <a href="{{ url_for('web.makeup_editor') }}">Make-up Editor</a>
    <a href="{{ url_for('web.attendance_month') }}">Attendance</a>
    <a href="{{ url_for('web.billing_page') }}">Billing</a>
    <a href="{{ url_for('web.payments_page') }}">Payment</a>
    <a href="{{ url_for('web.reports_page') }}">Reports</a>
    <a href="{{ url_for('web.master_data_index') }}">Master Data</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <p class="flash {{ category }}">{{ message }}</p>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
